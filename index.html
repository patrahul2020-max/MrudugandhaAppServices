    <script>
      // Suppress Vite HMR WebSocket disconnect noise from triggering error overlay
      window.addEventListener('error', function(e) {
        if (e && (
          (e.message && /websocket/i.test(e.message)) ||
          (e.filename && e.filename.includes('@vite/client'))
        )) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && /websocket/i.test(String(e.reason))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
