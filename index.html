    <script>
      // In AI Studio preview, HMR WebSocket is disabled (per environment constraints: "HMR: Disabled. Ignore WebSocket errors.")
      // Provide a clean no-op WebSocket for Vite HMR ('vite-hmr') so @vite/client never fails or throws connection errors
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWS = window.WebSocket;
          function ViteSafeWebSocket(url, protocols) {
            const isViteHmr =
              (typeof protocols === 'string' && protocols === 'vite-hmr') ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && (url.includes('token=') || url.includes('/@vite')));

            if (isViteHmr) {
              // Return a silent mock socket with readyState OPEN (1)
              const mock = {
                url: String(url),
                readyState: 1, // WebSocket.OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                binaryType: 'blob',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                send() {},
                close() {},
                addEventListener(type, listener) {
                  if (type === 'open') {
                    setTimeout(() => {
                      if (typeof listener === 'function') listener(new Event('open'));
                    }, 0);
                  }
                },
                removeEventListener() {},
                dispatchEvent() { return true; }
              };
              return mock;
            }
            return new OrigWS(url, protocols);
          }
          ViteSafeWebSocket.prototype = OrigWS.prototype;
          ViteSafeWebSocket.CONNECTING = 0;
          ViteSafeWebSocket.OPEN = 1;
          ViteSafeWebSocket.CLOSING = 2;
          ViteSafeWebSocket.CLOSED = 3;
          window.WebSocket = ViteSafeWebSocket;
        }

        // Also suppress any console errors or unhandled rejections referencing WebSocket or [vite]
        function isViteHmrError(msg, err) {
          const str = (String(msg || '') + ' ' + String(err?.message || '') + ' ' + String(err?.stack || '')).toLowerCase();
          return str.includes('websocket') || str.includes('[vite]') || str.includes('@vite/client');
        }

        const _origError = console.error;
        console.error = function(...args) {
          const joined = args.map(a => (typeof a === 'object' && a !== null ? (a.message || a.stack || JSON.stringify(a)) : String(a))).join(' ');
          if (isViteHmrError(joined)) return;
          _origError.apply(console, args);
        };

        const _origWarn = console.warn;
        console.warn = function(...args) {
          const joined = args.map(a => (typeof a === 'object' && a !== null ? (a.message || a.stack || JSON.stringify(a)) : String(a))).join(' ');
          if (isViteHmrError(joined)) return;
          _origWarn.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          if (e && (
            isViteHmrError(e.message, e.error) ||
            (e.filename && e.filename.includes('@vite/client'))
          )) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e && isViteHmrError(e.reason?.message || e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
